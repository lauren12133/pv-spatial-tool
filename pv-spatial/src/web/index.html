<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pv-spatial · 虚拟 7.1 调音台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">PV</div>
      <div>
        <h1>虚拟 7.1 调音台</h1>
        <p class="sub">8 声道 → 每方向增益 → HRIR → 双耳</p>
      </div>
    </div>
    <div class="run">
      <span id="led" class="led"></span>
      <span id="runText" class="runText">未启动</span>
      <button id="btnRun" class="primary">启动</button>
    </div>
  </header>

  <div id="warn" class="warn hidden"></div>

  <section class="row devices">
    <label>
      <span>源（loopback 采集）</span>
      <select id="selSource"></select>
    </label>
    <label>
      <span>输出（耳机）</span>
      <select id="selSink"></select>
    </label>
    <button id="btnRefresh" class="ghost" title="重新枚举音频端点（插拔设备后用）">刷新设备</button>
    <div class="meterBox">
      <div class="kv"><i>处理块</i><b id="kBlock">—</b></div>
      <div class="kv"><i>缓冲</i><b id="kBuf">—</b></div>
      <div class="kv"><i>欠载</i><b id="kXrun">—</b></div>
    </div>
  </section>

  <main>
    <section class="panel channels">
      <div class="panelHead">
        <h2>方向增益</h2>
        <div class="presets">
          <button data-preset="flat">平直</button>
          <button data-preset="tac">战术·脚步</button>
          <button data-preset="cinema">影院</button>
          <button data-preset="muteBack">只听前方</button>
        </div>
      </div>
      <div id="chList"></div>
    </section>

    <aside class="panel radarPanel">
      <div class="panelHead"><h2>声场</h2></div>
      <svg id="radar" viewBox="0 0 300 300" aria-label="方位雷达"></svg>
      <p class="hint">半径 = 该方向增益，拖下面滑块会实时变。</p>
      <div class="globals">
        <label class="mini">
          <span>总补偿</span>
          <input id="makeup" type="range" min="-30" max="12" step="0.5">
          <b id="makeupVal">—</b>
        </label>
        <label class="mini">
          <span>块长</span>
          <select id="block">
            <option value="64">64（1.3 ms，最省延迟）</option>
            <option value="128">128（2.7 ms，推荐）</option>
            <option value="256">256（5.3 ms）</option>
            <option value="480">480（10 ms，与引擎同步）</option>
          </select>
        </label>
      </div>
    </aside>
  </main>

  <footer>
    <span>PureVox 引擎是单声道（<code>capture.rs</code> 把 N 声道求平均），所以这套功能必须是独立通路。</span>
  </footer>
</div>
<script src="/app.js"></script>
</body>
</html>
