[package]
name = "pv-spatial"
version = "0.1.0"
edition = "2021"
description = "8 声道虚拟 7.1 调音台：WASAPI loopback → 每声道增益/延时 → HRIR → 2 声道耳机"

[[bin]]
name = "pv-spatial"
path = "src/main.rs"

[dependencies]
rustfft = "6"
rtrb = "0.3"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",          # 解决 PROPVARIANT 底层依赖
    "Win32_System_Ole",              # 解决 PROPVARIANT 底层依赖
] }
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
